services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTIKI_NG_TAG: release/v5.2
    image: rpl-ids:latest
    container_name: rpl-ids
    tty: true
    stdin_open: true
    working_dir: /home/user/rpl-ids
    environment:
      MPLBACKEND: Agg
      # remap-user.sh gives the container user these ids so bind-mounted
      # files are owned by the host user. Export them in your shell or rely
      # on the defaults below.
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-984}
      # X11 forwarding for the Cooja GUI (used for screenshots only).
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - .:/home/user/rpl-ids
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
